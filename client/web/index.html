<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Adventum</title>
<style>
  /* SUSE Mono is the same font the win32 build bakes into its glyph atlas
     (FONT_PIXEL_SIZE=32 in adv_text.odin). Loading it as a webfont keeps the
     web build visually identical to native — without it the canvas falls back
     to the system monospace which is wider / has different bearings. */
  @font-face {
    font-family: "SUSE Mono";
    src: url("res/fonts/SUSEMono-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block; /* hold the splash until the font is ready */
  }
  html, body { margin: 0; padding: 0; background: #050507; height: 100%; overflow: hidden; }
  body { font-family: "SUSE Mono", monospace; color: #aab; }
  /* Stage fills the iframe. Both canvases use the same pixel dimensions,
     resized to match the viewport on load/resize so the WebGL background
     and 2D shapes/text stay aligned. */
  #stage  { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  /* touch-action: none stops the browser from interpreting drags/pinches as
     page scroll or pinch-zoom so host.js can consume them as camera pan/zoom. */
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; touch-action: none; -webkit-user-select: none; user-select: none; }
  #screen { image-rendering: pixelated; background: transparent; }
  #bg     { background: #050507; }

  /* Splash: shown until the wasm finishes loading and web_init runs. The
     image is sized so it fits inside small mobile iframes (max 80vw / 60vh)
     while staying crisp on desktop. The progress bar sits directly under it. */
  #splash {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; background: #050507;
    z-index: 10;
    transition: opacity 0.35s ease-out;
  }
  #splash.fade { opacity: 0; pointer-events: none; }
  #splash-img {
    max-width: 80vw; max-height: 60vh;
    width: auto; height: auto;
    image-rendering: auto;
    user-select: none; -webkit-user-drag: none;
  }
  #splash-bar {
    width: min(480px, 70vw); height: 8px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05);
  }
  #splash-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #5b8cff 0%, #8fb6ff 100%);
    transition: width 0.15s ease-out;
  }
  #splash-text {
    font-size: 13px; letter-spacing: 1px;
    color: #8a93a8; opacity: 0.9;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"     width="1280" height="720"></canvas>
  <canvas id="screen" width="1280" height="720" tabindex="0"></canvas>
</div>
<div id="splash">
  <img id="splash-img" src="res/sprites/doggo-splash.png" alt="Atto Engine">
  <div id="splash-bar"><div id="splash-fill"></div></div>
  <div id="splash-text">loading…</div>
</div>
<!-- CrazyGames SDK. Falls through gracefully (window.CrazyGames undefined)
     when served outside the CrazyGames iframe — host.js gates every call. -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<script type="module" src="host.js"></script>
</body>
</html>
